
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Photo Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        .popup {
            width: 260px;
        }

        .popup h3 {
            margin: 0 0 10px;
        }

        .thumbnails {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .thumbnails img {
            width: 100%;
            height: 75px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 3px;
        }

        .count {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        #viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .95);
            z-index: 2000;
            overflow: auto;
            align-items: flex-start;
            justify-content: flex-start;
        }

        #largeImage {
            display: block;
            max-width: none;
            max-height: none;
            width: auto;
            height: auto;
            margin: auto;
            cursor: zoom-in;
            flex-shrink: 0;
        }

        #largeImage.zoomed {
            width: auto;
            height: auto;
            max-width: none;
            max-height: none;
            margin: 0;
            cursor: zoom-out;
        }

        #viewer img {
            max-width: 90vw;
            max-height: 88vh;
            object-fit: contain;
            cursor: zoom-in;
            transform-origin: center;
        }

        #viewer img.zoomed {
            max-width: none;
            max-height: none;
            cursor: zoom-out;
            transform: scale(2);
        }

        .control {
            position: absolute;
            color: white;
            font-size: 32px;
            cursor: pointer;
            user-select: none;
            padding: 10px 18px;
            top: 45%;
        }

        #close {
            top: 5px;
            right: 10px;
        }

        #prev {
            left: 10px;
        }

        #next {
            right: 10px;
        }

        #caption {
            position: absolute;
            bottom: 12px;
            color: white;
            font-size: 14px;
        }
    </style>
</head>

<body>
<div id="map"></div>

<div id="viewer">
    <span id="close" class="control">×</span>
    <span id="prev" class="control">‹</span>
    <img id="largeImage" alt="">
    <span id="next" class="control">›</span>
    <div id="caption"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map");

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let gallery = [];
let imageIndex = 0;

const viewer = document.getElementById("viewer");
const largeImage = document.getElementById("largeImage");
const caption = document.getElementById("caption");

function openImage(images, index) {
    gallery = images;
    imageIndex = index;
    showImage();

    viewer.style.display = "flex";
}

function showImage() {
    largeImage.src = gallery[imageIndex];
    largeImage.classList.remove("zoomed");

    caption.textContent =
        `${imageIndex + 1} / ${gallery.length}`;
}

function closeViewer() {
    viewer.style.display = "none";
    largeImage.src = "";
}

function previousImage() {
    imageIndex = (imageIndex - 1 + gallery.length) % gallery.length;
    showImage();
}

function nextImage() {
    imageIndex = (imageIndex + 1) % gallery.length;
    showImage();
}

document.getElementById("close").onclick = closeViewer;
document.getElementById("prev").onclick = previousImage;
document.getElementById("next").onclick = nextImage;

largeImage.onclick = () => {
    largeImage.classList.toggle("zoomed");

    if (!largeImage.classList.contains("zoomed")) {
        viewer.scrollTo(0, 0);
    }
};

largeImage.onwheel = event => {
    return;
    event.preventDefault();

    if (event.deltaY < 0) {
        largeImage.classList.add("zoomed");
    } else {
        largeImage.classList.remove("zoomed");
        viewer.scrollTo(0, 0);
    }
};

document.addEventListener("keydown", event => {
    if (viewer.style.display !== "flex") return;

    if (event.key === "Escape") closeViewer();
    if (event.key === "ArrowLeft") previousImage();
    if (event.key === "ArrowRight") nextImage();
});

async function loadPoints() {
    const response = await fetch("points.json");

    if (!response.ok) {
        throw new Error(`Cannot load points.json: ${response.status}`);
    }

    const points = await response.json();
    const bounds = [];

    for (const point of points) {
        const marker = L.marker([point.lat, point.lon])
            .addTo(map)
            .bindTooltip(String(point.name || "Unnamed"), {
                permanent: true,
                direction: "right",
                offset: [8, 0]
            });

        const images = [...new Set(point.images || [])];

        const popup = document.createElement("div");
        popup.className = "popup";

        const heading = document.createElement("h3");
        heading.textContent = point.name || "Unnamed";
        popup.appendChild(heading);

        const count = document.createElement("div");
        count.className = "count";
        count.textContent = `${images.length} image(s)`;
        popup.appendChild(count);

        const thumbnails = document.createElement("div");
        thumbnails.className = "thumbnails";

        images.forEach((src, index) => {
            const img = document.createElement("img");
            img.src = src;
            img.alt = `Image ${index + 1}`;
            img.loading = "lazy";
            img.title = "Click to view full image";

            img.onclick = () => openImage(images, index);

            thumbnails.appendChild(img);
        });

        popup.appendChild(thumbnails);

        marker.bindPopup(popup);
        bounds.push([point.lat, point.lon]);
    }

    if (bounds.length === 1) {
        map.setView(bounds[0], 17);
    } else if (bounds.length > 1) {
        map.fitBounds(bounds, { padding: [30, 30] });
    } else {
        map.setView([56.35, 41.54], 12);
    }
}

loadPoints().catch(error => {
    console.error(error);
    alert("Failed to load map data. Check the browser console.");
});
</script>
</body>
</html>
